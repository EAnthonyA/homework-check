name: Main CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.4.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

  build:
    name: Docker Build & Smoke Test
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t homework-check:ci .

      - name: Smoke test Docker image
        run: |
          docker run -d --name app-test -p 3000:3000 homework-check:ci
          sleep 8

          # Check if container is running
          if ! docker ps | grep app-test; then
            echo "Container failed to start"
            docker logs app-test
            exit 1
          fi

          # Verify the server responds
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:3000/ || echo "Server not responding yet"

          # Cleanup
          docker logs app-test
          docker stop app-test
          docker rm app-test
