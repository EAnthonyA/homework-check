name: Deploy to Production

# Triggers only after the CI pipeline completes successfully on main
on:
  workflow_run:
    workflows: ['Main CI Pipeline']
    types: [completed]
    branches: [main]

jobs:
  build-push:
    name: Build & Push Image
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    uses: ./.github/workflows/build-push.yml
    secrets: inherit

  deploy:
    name: Deploy to VPS
    needs: build-push
    if: |
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      needs.build-push.result == 'success'
    uses: ./.github/workflows/deploy-vps.yml
    secrets: inherit
