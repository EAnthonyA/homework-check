server {
    listen 80;
    listen [::]:80;
    server_name pavilnys5b.lt www.pavilnys5b.lt;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pavilnys5b.lt www.pavilnys5b.lt;

    ssl_certificate /etc/nginx/conf.d/certs/pavilnys5b.lt.pem;
    ssl_certificate_key /etc/nginx/conf.d/certs/pavilnys5b.lt.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker embedded DNS so nginx resolves at request time (works even when
    # homework-check is down at nginx reload).
    resolver 127.0.0.11 valid=10s;

    location / {
        set $hc_upstream homework-check-prod:3000;
        proxy_pass http://$hc_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Kid photo uploads (screenshots)
    client_max_body_size 35m;
}
