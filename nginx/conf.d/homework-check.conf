server {
    listen 80;
    listen [::]:80;
    server_name pavilnys5b.lt www.pavilnys5b.lt;

    # Docker embedded DNS so nginx resolves at request time (works even when
    # homework-check is down at nginx reload).
    resolver 127.0.0.11 valid=10s;

    location / {
        set $hc_upstream homework-check-prod:3000;
        proxy_pass http://$hc_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kid photo uploads (screenshots)
    client_max_body_size 35m;
}
